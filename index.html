<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ZAIN VIRAL HUB</title>
<style>
:root {
	--bg: #0c0f10;
	--panel: #14181b;
	--card: #181d21;
	--text: #f3f6f8;
	--muted: #9aa5b1;
	--accent: #e50914;
	--glass: rgba(12, 15, 16, 0.72);
}
* { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, sans-serif; }
body { background: var(--bg); color: var(--text); user-select: none; overflow-x: hidden; }

/* Top Nav */
.topnav {
	position: fixed;
	top: 0; left: 0; right: 0;
	z-index: 60;
	display: flex;
	align-items: center;
	justify-content: space-between;
	gap: 16px;
	padding: 16px 4%;
	background: linear-gradient(180deg, rgba(10,12,14,0.92) 0%, rgba(10,12,14,0.25) 100%);
	backdrop-filter: blur(8px);
}
.nav-left { display: flex; align-items: center; gap: 28px; flex-wrap: wrap; }
.brand { font-weight: 800; font-size: 1.15rem; letter-spacing: 0.8px; color: #fff; }
.brand span { color: var(--accent); }
.nav-links { display: flex; gap: 20px; list-style: none; }
.nav-links button {
	background: none; border: none; color: var(--muted);
	font-size: 0.92rem; font-weight: 600; cursor: pointer; padding: 4px 0;
	transition: 0.2s;
}
.nav-links button.active, .nav-links button:hover { color: #fff; }

.nav-right { display: flex; align-items: center; gap: 12px; }
.search-input {
	background: rgba(255,255,255,0.08);
	border: 1px solid rgba(255,255,255,0.14);
	color: #fff;
	padding: 8px 14px;
	border-radius: 20px;
	width: 210px;
	font-size: 0.85rem;
	outline: none;
}
.creator-btn {
	background: rgba(255,255,255,0.1);
	border: 1px solid rgba(255,255,255,0.18);
	color: #fff;
	padding: 7px 13px;
	border-radius: 20px;
	font-size: 0.8rem;
	font-weight: 600;
	cursor: pointer;
}
.creator-btn.unlocked { background: var(--accent); border-color: var(--accent); }

/* Hero Banner */
.hero {
	position: relative;
	min-height: 76vh;
	display: flex;
	align-items: flex-end;
	padding: 110px 4% 56px;
	background-size: cover;
	background-position: center;
}
.hero::before {
	content: "";
	position: absolute;
	inset: 0;
	background:
	linear-gradient(90deg, rgba(12,15,16,0.92) 0%, rgba(12,15,16,0.55) 55%, rgba(12,15,16,0.2) 100%),
	linear-gradient(180deg, rgba(12,15,16,0.35) 0%, rgba(12,15,16,0) 35%, var(--bg) 100%);
}
.hero-inner { position: relative; z-index: 2; max-width: 560px; }
.hero-tags { display: flex; gap: 10px; margin-bottom: 14px; flex-wrap: wrap; }
.pill {
	background: rgba(255,255,255,0.12);
	border: 1px solid rgba(255,255,255,0.18);
	padding: 4px 12px;
	border-radius: 999px;
	font-size: 0.75rem;
	color: #e2e8f0;
}
.hero-title { font-size: clamp(1.8rem, 4vw, 3.1rem); font-weight: 800; line-height: 1.1; margin-bottom: 12px; }
.hero-meta { color: #cbd5e1; font-size: 0.9rem; margin-bottom: 22px; }
.hero-actions { display: flex; align-items: center; gap: 14px; }
.play-now-btn {
	background: rgba(255,255,255,0.16);
	backdrop-filter: blur(8px);
	border: 1px solid rgba(255,255,255,0.28);
	color: #fff;
	padding: 12px 24px;
	border-radius: 8px;
	font-size: 0.95rem;
	font-weight: 700;
	cursor: pointer;
	display: inline-flex;
	align-items: center;
	gap: 8px;
	transition: 0.2s;
}
.play-now-btn:hover { background: #fff; color: #0c0f10; }
.fav-btn {
	width: 44px; height: 44px;
	border-radius: 50%;
	background: rgba(255,255,255,0.1);
	border: 1px solid rgba(255,255,255,0.22);
	color: #fff;
	font-size: 1.15rem;
	cursor: pointer;
}

/* Sections & Rows */
.main-container { padding: 12px 4% 64px; }
.section-block { margin-bottom: 36px; }
.section-header {
	display: flex;
	justify-content: space-between;
	align-items: center;
	margin-bottom: 14px;
}
.section-title { font-size: 1.15rem; font-weight: 700; color: #fff; }
.section-sub { font-size: 0.78rem; color: var(--muted); }

.row-grid {
	display: grid;
	grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
	gap: 16px;
}
.media-card {
	background: var(--card);
	border-radius: 10px;
	overflow: hidden;
	cursor: pointer;
	position: relative;
	border: 1px solid rgba(255,255,255,0.06);
	transition: transform 0.22s ease, border-color 0.22s ease;
}
.media-card:hover { transform: translateY(-4px); border-color: rgba(255,255,255,0.24); }
.thumb-box { position: relative; aspect-ratio: 16/10; background: #000; overflow: hidden; }
.media-card.portrait .thumb-box { aspect-ratio: 3/4; }
.thumb-box img { width: 100%; height: 100%; object-fit: cover; pointer-events: none; }
.play-badge {
	position: absolute;
	bottom: 10px; right: 10px;
	width: 34px; height: 34px;
	border-radius: 50%;
	background: rgba(12,15,16,0.78);
	border: 1px solid rgba(255,255,255,0.3);
	color: #fff;
	display: flex; align-items: center; justify-content: center;
	font-size: 0.8rem;
}
.del-btn {
	display: none;
	position: absolute;
	top: 8px; right: 8px;
	z-index: 5;
	background: var(--accent);
	color: #fff;
	border: none;
	border-radius: 6px;
	padding: 4px 8px;
	font-size: 0.72rem;
	font-weight: 700;
	cursor: pointer;
}
body.creator-unlocked .del-btn { display: block; }

.card-info { padding: 10px 12px; }
.card-name {
	font-size: 0.86rem; font-weight: 600; line-height: 1.3;
	display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
}
.card-date { font-size: 0.72rem; color: var(--muted); margin-top: 5px; }

/* Modal */
.modal {
	display: none; position: fixed; inset: 0; z-index: 120;
	background: rgba(0,0,0,0.9); align-items: center; justify-content: center; padding: 18px;
}
.modal.open { display: flex; }
.modal-box {
	background: var(--panel); border: 1px solid rgba(255,255,255,0.12);
	border-radius: 12px; width: 100%; max-width: 880px; overflow: hidden;
}
.modal-top {
	display: flex; justify-content: space-between; align-items: center;
	padding: 12px 16px; border-bottom: 1px solid rgba(255,255,255,0.08);
}
.close-x {
	background: rgba(255,255,255,0.12); color: #fff; border: none;
	padding: 6px 12px; border-radius: 6px; cursor: pointer; font-weight: 700;
}
.stage {
	width: 100%; aspect-ratio: 16/9; background: #000;
	display: flex; align-items: center; justify-content: center;
}
.stage.short-stage { aspect-ratio: 9/16; max-height: 76vh; margin: auto; }
.stage iframe { width: 100%; height: 100%; border: none; }
.stage img { max-width: 100%; max-height: 76vh; object-fit: contain; pointer-events: none; }
</style>
</head>
<body oncontextmenu="return false;">

<nav class="topnav">
<div class="nav-left">
<div class="brand">ZAIN <span>HUB</span></div>
<ul class="nav-links">
<li><button class="active" onclick="filterSection('all', this)">Home</button></li>
<li><button onclick="filterSection('shorts', this)">Shorts</button></li>
<li><button onclick="filterSection('videos', this)">Videos</button></li>
<li><button onclick="filterSection('photos', this)">Photos</button></li>
</ul>
</div>
<div class="nav-right">
<input class="search-input" id="searchBox" placeholder="Search..." oninput="renderAll()" />
<button class="creator-btn" id="creatorBtn" onclick="toggleCreatorMode()">🔒 Creator</button>
</div>
</nav>

<section class="hero" id="heroBanner">
<div class="hero-inner">
<div class="hero-tags">
<span class="pill" id="heroPlatform">Featured</span>
<span class="pill" id="syncInfo">Syncing...</span>
</div>
<h1 class="hero-title" id="heroTitle">Loading Viral Feed...</h1>
<p class="hero-meta" id="heroMeta">Auto-updated every 3 hours • Streaming Only</p>
<div class="hero-actions">
<button class="play-now-btn" id="heroPlayBtn">▶ Play now</button>
<button class="fav-btn" id="heroFavBtn" title="Save">♡</button>
</div>
</div>
</section>

<main class="main-container" id="mainSections"></main>

<div class="modal" id="modal" onclick="if(event.target.id==='modal') closeModal()">
<div class="modal-box" onclick="event.stopPropagation()">
<div class="modal-top">
<span id="modalTitle" style="font-weight:600;font-size:0.92rem;"></span>
<button class="close-x" onclick="closeModal()">✕</button>
</div>
<div class="stage" id="stage"></div>
</div>
</div>

<script>
let store = { videos: [], shorts: [], photos: [], last_updated: "" };
let activeFilter = "all";
let creatorPin = "";
let heroItem = null;

async function loadData() {
	const res = await fetch("feed_data.json?t=" + Date.now());
	store = await res.json();
	document.getElementById("syncInfo").innerText = "Updated: " + (store.last_updated || "Now");
	setupHero();
	renderAll();
}

function setupHero() {
	const pick = store.videos[0] || store.shorts[0] || store.photos[0];
	if (!pick) return;
	heroItem = pick;
	const bg = pick.image_url || pick.thumbnail;
	document.getElementById("heroBanner").style.backgroundImage = `url('${bg}')`;
	document.getElementById("heroPlatform").innerText = (pick.platform || "HUB").toUpperCase();
	document.getElementById("heroTitle").innerText = pick.title;
	document.getElementById("heroMeta").innerText = `Added ${pick.added_at} • Stream Only`;
	document.getElementById("heroPlayBtn").onclick = () => openMedia(pick, pick.type || (pick.image_url ? "photo" : "video"));
}

function filterSection(sec, btn) {
	activeFilter = sec;
	document.querySelectorAll(".nav-links button").forEach(b => b.classList.remove("active"));
	btn.classList.add("active");
	renderAll();
}

function toggleCreatorMode() {
	const btn = document.getElementById("creatorBtn");
	if (document.body.classList.contains("creator-unlocked")) {
		document.body.classList.remove("creator-unlocked");
		creatorPin = "";
		btn.classList.remove("unlocked");
		btn.innerText = "🔒 Creator";
		return;
	}
	const pin = prompt("Enter Creator PIN:");
	if (!pin) return;
	creatorPin = pin;
	document.body.classList.add("creator-unlocked");
	btn.classList.add("unlocked");
	btn.innerText = "🔓 Unlocked (Delete On)";
}

async function deleteItem(ev, id, category) {
	ev.stopPropagation();
	if (!confirm("Permanently delete this item?")) return;
	const res = await fetch("/api/delete", {
		method: "POST",
		headers: { "Content-Type": "application/json" },
		body: JSON.stringify({ id, category, pin: creatorPin })
	});
	const out = await res.json();
	if (!out.ok) {
		alert(out.error || "Delete failed");
		return;
	}
	await loadData();
}

function cardHtml(item, category) {
	const q = document.getElementById("searchBox").value.toLowerCase();
	if (q && !(item.title || "").toLowerCase().includes(q)) return "";
	
	const isPortrait = category === "shorts" || category === "photos";
	const thumb = category === "photos" ? item.image_url : item.thumbnail;
	const playIcon = category === "photos" ? "" : `<div class="play-badge">▶</div>`;
	const safeObj = encodeURIComponent(JSON.stringify(item));
	
	return `
	<div class="media-card ${isPortrait ? "portrait" : ""}" onclick="openFromEncoded('${safeObj}', '${category}')">
	<button class="del-btn" onclick="deleteItem(event, '${item.id}', '${category}')">Delete</button>
	<div class="thumb-box">
	<img src="${thumb}" loading="lazy" alt="media" />
	${playIcon}
	</div>
	<div class="card-info">
	<div class="card-name">${item.title}</div>
	<div class="card-date">${item.added_at || ""}</div>
	</div>
	</div>
	`;
}

function renderAll() {
	const container = document.getElementById("mainSections");
	const sections = [
		{ key: "videos", title: "Videos", sub: "Full edits & montages" },
		{ key: "shorts", title: "Shorts", sub: "Quick viral clips" },
		{ key: "photos", title: "Pinterest Photos", sub: "Wallpapers & art" },
	];
	
	container.innerHTML = sections
	.filter(s => activeFilter === "all" || activeFilter === s.key)
	.map(s => {
		const list = store[s.key] || [];
		const cards = list.map(item => cardHtml(item, s.key)).join("");
		return `
		<div class="section-block">
		<div class="section-header">
		<div class="section-title">${s.title} (${list.length})</div>
		<div class="section-sub">${s.sub}</div>
		</div>
		<div class="row-grid">${cards || "<p style='color:#9aa5b1;font-size:0.85rem;'>No items found.</p>"}</div>
		</div>
		`;
	}).join("");
}

function openFromEncoded(encoded, category) {
	const item = JSON.parse(decodeURIComponent(encoded));
	openMedia(item, category);
}

function openMedia(item, category) {
	document.getElementById("modalTitle").innerText = item.title;
	const stage = document.getElementById("stage");
	if (category === "photos" || item.image_url) {
		stage.className = "stage";
		stage.innerHTML = `<img src="${item.image_url}" alt="preview" />`;
	} else {
		stage.className = category === "shorts" ? "stage short-stage" : "stage";
		stage.innerHTML = `<iframe src="${item.embed_url}" allow="autoplay; encrypted-media" allowfullscreen></iframe>`;
	}
	document.getElementById("modal").classList.add("open");
}

function closeModal() {
	document.getElementById("modal").classList.remove("open");
	document.getElementById("stage").innerHTML = "";
}

loadData();
</script>
</body>
</html>
